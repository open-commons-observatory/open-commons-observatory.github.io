name: harvest
# Every marked project's exported tables, gathered into data/, and the site rendered from them and
# published - the picture keeps itself current.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: harvest
  cancel-in-progress: false
jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: ocoeco gathers, the engine renders
        run: |
          cargo install --locked --git https://github.com/open-commons-observatory/ocoeco ocoeco
          cargo install --locked --git https://github.com/open-commons-observatory/ocoeco-engine oco
      - name: harvest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ocoeco observe --out data
      - name: commit what changed
        run: |
          git add data
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          # the name is the repository's, not one command's: a rebase after a collision signs its commit too
          git config user.name "oco harvest"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "data: the harvest"
          # changes may land while the harvest works (land starts harvests): rebase its data onto them and retry
          for try in 1 2 3 4 5; do
            git push && exit 0
            echo "main moved while harvesting (try $try): rebasing the harvest onto it"
            # the data is observed whole each time, and this observation is the later one: where it
            # meets data landed meanwhile, its own wins - nothing but the harvest writes data/
            git pull --rebase -q -X theirs origin main
          done
          echo "could not push the harvest after five tries"; exit 1
      - name: the engine lenses focus with (DuckDB, pinned by fingerprint - the one tad checks and installs)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/duckdb.zip" https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-linux-amd64.zip
          echo "08c0ca117111fcede14239d0093792352befdc174218c344d232c13279643d05  $RUNNER_TEMP/duckdb.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/duckdb" && unzip -q "$RUNNER_TEMP/duckdb.zip" -d "$RUNNER_TEMP/duckdb"
          echo "$RUNNER_TEMP/duckdb" >> "$GITHUB_PATH"
      - name: the site
        run: |
          oco site --data data --out _site
          # the fulldome, beside the engine's views: every lens, in focus, over what was observed
          ocoeco fulldome --observed data --surface html > _site/fulldome.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  publish:
    needs: harvest
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
